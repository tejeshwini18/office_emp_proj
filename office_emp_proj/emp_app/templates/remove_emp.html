{% extends 'base.html' %}

{% block title %}Remove Employee - Office Employee Management System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <h2 class="card-title text-center mb-4">Remove Employee</h2>
                
                <div class="text-center">
                    <div class="dropdown">
                        <button class="btn btn-primary btn-lg dropdown-toggle" type="button" id="dropdownMenuButton1" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fas fa-user-minus me-2"></i>Choose Employee To Remove
                        </button>
                        <ul class="dropdown-menu dropdown-menu-center" aria-labelledby="dropdownMenuButton1">
                            {% for emp in emps %}
                            <li>
                                <a class="dropdown-item" href="/remove_emp/{{emp.id}}">
                                    <i class="fas fa-user me-2"></i>{{emp.first_name}} {{emp.last_name}}
                                </a>
                            </li>
                            {% endfor %}
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

    <!-- Optional JavaScript; choose one of the two! -->

    <!-- Option 1: Bootstrap Bundle with Popper -->

</html>
